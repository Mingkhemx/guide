<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004435"/>
      <stop offset="50%" stop-color="#0b5d4b"/>
      <stop offset="100%" stop-color="#002b21"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE088"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="128" fill="url(#emeraldGrad)"/>
  
  <!-- Subtle Islamic star pattern ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#8dd4bd" stroke-width="1.5" opacity="0.2"/>

  <!-- Centered Ka'bah Geometric Emblem -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Ka'bah Body Isometric/Perspective -->
    <!-- Front Face -->
    <polygon points="-75,-50 0,-15 0,75 -75,40" fill="#141E1A" stroke="#28332E" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="0,-15 75,-50 75,40 0,75" fill="#0A0F0D" stroke="#28332E" stroke-width="2"/>
    <!-- Top Face -->
    <polygon points="-75,-50 0,-85 75,-50 0,-15" fill="#1F2A25" stroke="#28332E" stroke-width="2"/>

    <!-- Kiswah Gold Belt (Hizam) on Front Face -->
    <polygon points="-75,-25 0,10 0,22 -75,-13" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Kiswah Gold Belt on Right Face -->
    <polygon points="0,10 75,-25 75,-13 0,22" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Golden Door (Bab al-Ka'bah) -->
    <polygon points="18,-1 54,-18 54,20 18,36" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- Mizab ar-Rahmah (Golden Spout) -->
    <line x1="-38" y1="-67" x2="-45" y2="-72" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sacred Golden Crescent above -->
  <path d="M 256 75 A 40 40 0 0 1 292 110 A 32 32 0 0 0 258 84 A 40 40 0 0 1 256 75 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <polygon points="278,92 281,100 289,101 283,106 285,114 278,110 271,114 273,106 267,101 275,100" fill="url(#goldGrad)"/>
</svg>
